name: Build PCCamera
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get AML headers
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader aml
          cp -r aml/mod jni/mod
      - name: Build
        run: $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
      - uses: actions/upload-artifact@v4
        with:
          name: VC.PCCamera
          path: libs/armeabi-v7a/libPCCamera.so
